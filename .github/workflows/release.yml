name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/the-running-dev/subzerodev-plugins-github

jobs:
  quality:
    name: Release quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run package:check

  publish:
    name: Publish signed artifacts
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build && npm run package:check
      - name: Resolve release identity
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then tag="${DISPATCH_TAG}"; fi
          version="${tag#v}"
          npx tsx tools/check-release-version.ts "$tag" "$version"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build local image and verify labels/container contract
        shell: pwsh
        run: ./build/Test-Container.ps1 -Build -Image '${{ env.IMAGE }}:${{ steps.release.outputs.version }}'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image by digest
        run: cosign sign --yes '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
      - name: Build and attest release manifest
        run: |
          npx tsx tools/build-release-manifest.ts '${{ steps.image.outputs.digest }}'
          npm run package:check
          gh attestation sign --subject-path release/plugin.manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack and publish npm package with provenance
        run: |
          npm pack --ignore-scripts
          npm publish ./*.tgz --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        run: >-
          gh release create '${{ steps.release.outputs.tag }}'
          ./*.tgz release/plugin.manifest.json
          --verify-tag --generate-notes
          --title '${{ steps.release.outputs.tag }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
